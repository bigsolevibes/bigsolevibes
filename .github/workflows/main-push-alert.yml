name: Main Push Alert

# Fires server-side on every push to main — no local hook, no pipeline, no bypass.
# Sends Telegram to Big D immediately with commit details.
# If this alert fires and Big D didn't say "push it to main" in chat: investigate.

on:
  push:
    branches:
      - main

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          MSG="${{ github.event.head_commit.message }}"
          # Truncate long commit messages
          MSG="${MSG:0:120}"

          TEXT="🔔 *BSV — Push to main*

Commit: \`${SHORT_SHA}\`
Author: ${AUTHOR}
Message: ${MSG}

If Big D did not authorize this push, investigate immediately.
https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=Markdown"
